[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrapilot-backend"
version = "0.1.0"
description = "AI-Powered Kubernetes Infrastructure Management backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.12",
    "websockets==13.1",

    # Database
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg2-binary==2.9.10",

    # Config & validation
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "pydantic[email]==2.10.3",

    # Security
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",

    # AI / agents
    "langgraph==0.2.60",
    "langchain==0.3.13",
    "langchain-google-genai==2.0.7",
    "google-generativeai==0.8.3",

    # Kubernetes
    "kubernetes==31.0.0",
    "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==7.1.0",
    "coverage==7.13.5",
    "httpx==0.27.2",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-passlib==1.7.7.20240819",
    "types-pyyaml==6.0.12.20240917",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
